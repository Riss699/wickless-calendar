<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wickless</title>
<script>
(function () {
  var t = null;
  try { t = window.localStorage.getItem('wickless.theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    try { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { t = 'light'; }
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{
  --bg:#FFFFFF;--bg2:#F6F6F8;--bg3:#F4F4F6;--ink:#111113;--ink2:#4B4B53;--ink3:#6B6B73;--line:#EAEAEE;--line2:#E4E4E9;--ctl:#D9D9DE;
  --hover:rgba(17,17,19,.035);--danger:#B21E3B;--past-bg:#F1F1F4;--up-bg:#FFE1E6;--up-fg:#B21E3B;--explain:#F6F6F8;--explain-ink:#2E2E35;--past-dot:#B5B5BD;
  --seg-asia:#F3EFFF;--seg-asia-b:#E2D9FF;--seg-lon:#E9F6F1;--seg-lon-b:#CDEBDD;--seg-ny:#FFF4E6;--seg-ny-b:#FFE0B8;--seg-ink:#2E2E35;
  --lv-calme-bg:#E7F0FF;--lv-calme-fg:#1D4FB0;--lv-calme-sw:#5B8DEF;--lv-calme-ac:#1D4FB0;
  --lv-prudence-bg:#FFF0DB;--lv-prudence-fg:#8A4800;--lv-prudence-sw:#F2A23C;--lv-prudence-ac:#8A4800;
  --lv-piege-bg:#FFE1E6;--lv-piege-fg:#B21E3B;--lv-piege-sw:#E5484D;--lv-piege-ac:#B21E3B;
  --lv-ferie-bg:#EEE9FF;--lv-ferie-fg:#5534B8;--lv-ferie-sw:#8B6CF0;--lv-ferie-ac:#5534B8;
  --mono:'Fragment Mono',ui-monospace,Menlo,monospace;--serif:'Instrument Serif',Georgia,serif;--sans:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.2,.75,.1,1);--pop:cubic-bezier(.34,1.56,.64,1);
}
[data-theme="dark"]{
  --bg:#0B0D12;--bg2:#151922;--bg3:#1A1F2A;--ink:#F2F4F8;--ink2:#B4BAC6;--ink3:#848B99;--line:#222733;--line2:#262C38;--ctl:#333A48;
  --hover:rgba(255,255,255,.04);--danger:#FF6B74;--past-bg:#1E2330;--up-bg:rgba(229,72,77,.2);--up-fg:#FF8A92;--explain:#151922;--explain-ink:#D9DDE5;--past-dot:#4A5060;
  --seg-asia:rgba(124,92,255,.22);--seg-asia-b:rgba(124,92,255,.5);--seg-lon:rgba(34,211,138,.16);--seg-lon-b:rgba(34,211,138,.45);--seg-ny:rgba(245,165,36,.18);--seg-ny-b:rgba(245,165,36,.5);--seg-ink:#E6E9EF;
  --lv-calme-bg:#2F6FEB;--lv-calme-fg:#FFFFFF;--lv-calme-sw:#2F6FEB;--lv-calme-ac:#6EA2FF;
  --lv-prudence-bg:#F5A524;--lv-prudence-fg:#1B1100;--lv-prudence-sw:#F5A524;--lv-prudence-ac:#FFB547;
  --lv-piege-bg:#D9343F;--lv-piege-fg:#FFFFFF;--lv-piege-sw:#E5484D;--lv-piege-ac:#FF5C66;
  --lv-ferie-bg:#7C5CFF;--lv-ferie-fg:#FFFFFF;--lv-ferie-sw:#7C5CFF;--lv-ferie-ac:#A48CFF;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
html.theming,html.theming *{transition:background-color .45s ease,color .45s ease,border-color .45s ease,fill .45s ease !important}
button,select{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#scene{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}
.wrap{max-width:1320px;margin:0 auto;padding:0 32px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.muted{font-size:14px;color:var(--ink3)}
.serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.02em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 auto}

/* Couleurs des niveaux */
.lv-calme,.lv-calmeShort{background:var(--lv-calme-bg);color:var(--lv-calme-fg)}
.lv-prudence{background:var(--lv-prudence-bg);color:var(--lv-prudence-fg)}
.lv-piege{background:var(--lv-piege-bg);color:var(--lv-piege-fg)}
.lv-ferie{background:var(--lv-ferie-bg);color:var(--lv-ferie-fg)}
.sw-calme,.sw-calmeShort{background:var(--lv-calme-sw)}
.sw-prudence{background:var(--lv-prudence-sw)}
.sw-piege{background:var(--lv-piege-sw)}
.sw-ferie{background:var(--lv-ferie-sw)}
.sw-past{background:var(--past-dot)}
.ac-calme,.ac-calmeShort{color:var(--lv-calme-ac)}
.ac-prudence{color:var(--lv-prudence-ac)}
.ac-piege,.ac-short{color:var(--lv-piege-ac)}
.ac-ferie{color:var(--lv-ferie-ac)}

/* En-tête */
.hdr{display:flex;flex-direction:column;gap:20px;padding:24px 0 20px}
.hdr-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.brand-name{font-size:23px;font-weight:600;letter-spacing:-.035em}
.badge{padding:5px 10px;border-radius:999px;background:var(--bg3);font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.hdr-right{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.lang{display:inline-flex;padding:3px;border:1px solid var(--ctl);border-radius:999px;background:var(--bg)}
.lang button{min-width:46px;min-height:40px;border:none;border-radius:999px;background:transparent;color:var(--ink3);font-size:13px;font-weight:600;transition:background-color .25s,color .25s}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;border:1px solid var(--ctl);background:var(--bg);color:var(--ink);transition:transform .5s var(--pop),border-color .2s}
.icon-btn:hover{border-color:var(--ink);transform:rotate(-25deg) scale(1.06)}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding-left:16px;border-left:1px solid var(--line)}
.clock-time{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.ccys{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{min-width:60px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);color:var(--ink3);font-size:13px;font-weight:600;letter-spacing:.02em;transition:border-color .2s,color .2s,background-color .2s,transform .3s var(--pop)}
.chip:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-2px)}
.chip:active{transform:scale(.92)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tzbox{display:flex;align-items:center;gap:10px}
.select{min-height:44px;max-width:300px;padding:0 16px;border-radius:999px;border:1px solid var(--ctl);background:var(--bg);font-size:14px;cursor:pointer}

/* Structure */
.main{display:flex;flex-direction:column;gap:64px;padding-bottom:56px}
.view{display:flex;flex-direction:column;gap:72px}
.sec{display:flex;flex-direction:column;gap:18px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px}
.hint{font-size:14px;color:var(--ink2)}
.notice{margin:0;padding:18px 22px;border-radius:18px;background:var(--bg2);font-size:15px;line-height:1.5;color:var(--ink2)}

/* Héros */
.hero,.dhero{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:space-between;gap:40px}
.hero{padding-top:56px;min-height:440px}
.dhero{min-height:420px}
.hero-l,.dhero-l{flex:1 1 560px;max-width:660px;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;will-change:transform,opacity}
.hero-l{gap:26px}
.dhero-l{align-items:flex-start;gap:22px}
.stage{flex:1 1 380px;min-height:340px}
.h1{margin:0;font-size:clamp(46px,5.8vw,84px);line-height:.98;font-weight:600;letter-spacing:-.045em}
.hl{display:block}
.lead{margin:0;max-width:560px;font-size:17px;line-height:1.6;color:var(--ink2);text-wrap:pretty}
.stats{display:flex;flex-wrap:wrap;gap:16px 0;max-width:560px}
.stat{flex:1 1 110px;display:flex;flex-direction:column;gap:6px;padding:0 16px;border-left:1px solid var(--line2)}
.stat b{font-family:var(--mono);font-weight:400;font-size:40px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600}
.pill .dot{width:7px;height:7px;background:currentColor;opacity:.55}

/* Semaine */
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}
.gl{width:100%;display:flex;align-items:center;gap:16px;min-height:116px;padding:0 30px;border:none;border-radius:999px;text-align:left;transition:transform .45s var(--pop),box-shadow .3s}
.gl:hover{transform:translateY(-6px) scale(1.02)}
.gl:active{transform:scale(.97)}
.gl.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.gl .num{font-size:54px;font-weight:600;line-height:1;letter-spacing:-.05em}
.gl .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.gl .d{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.gl .lv{font-size:15px;font-weight:600;line-height:1.2}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;font-size:13px;color:var(--ink2)}
.legend .it{display:inline-flex;align-items:center;gap:8px}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px;width:100%;padding:26px 14px;border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);text-align:left;transition:background-color .25s}
.row:hover{background:var(--hover)}
.row .c1{flex:0 0 190px;display:flex;align-items:center;gap:14px;transition:transform .45s var(--ease)}
.row:hover .c1{transform:translateX(8px)}
.row .num{font-size:46px;font-weight:600;line-height:1;letter-spacing:-.05em}
.row .c1m{display:flex;flex-direction:column;gap:6px}
.row .c2{flex:0 0 210px;display:flex}
.row .c3{flex:999 1 360px;min-width:0;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ev-chip{display:inline-flex;align-items:center;gap:10px;padding:9px 15px;border-radius:999px;background:var(--bg3);border:1px solid var(--bg3);font-size:14px;line-height:1.2;transition:transform .3s var(--pop)}
.row:hover .ev-chip{transform:translateY(-2px)}
.ev-chip.note{background:transparent;border:1px dashed var(--ctl)}
.ev-chip.past{opacity:.62}
.ev-chip .t{font-family:var(--mono);font-size:13px}
.ev-chip .g{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.ev-chip .n{font-weight:500}
.arrow{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;border:1px solid var(--ctl);background:var(--bg);color:var(--ink);transition:transform .45s var(--pop),background-color .25s,color .25s,border-color .25s}
.row:hover .arrow{transform:rotate(-45deg) scale(1.08);background:var(--ink);color:var(--bg);border-color:var(--ink)}
.today-tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--danger)}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:#E5484D;animation:pulse 1.8s ease-out infinite}
.upc{display:flex;flex-wrap:wrap;gap:16px 40px;padding:30px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.upc>.mono{flex:0 0 200px}
.upc-body{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:10px}
.upc h2{margin:0;font-size:28px;line-height:1.25;font-weight:600;letter-spacing:-.03em}
.upc p{margin:0;max-width:760px;font-size:16px;line-height:1.6;color:var(--ink2)}

/* Bandeaux qui défilent avec la page */
.mq{margin:0 calc(50% - 50vw);padding:6px 0;overflow:hidden;display:flex;flex-direction:column;gap:2px;pointer-events:none;user-select:none}
.mq-row{display:flex;width:max-content;white-space:nowrap;font-size:clamp(44px,7.5vw,112px);font-weight:600;letter-spacing:-.045em;line-height:1.08;will-change:transform;animation:mq var(--mq-dur,60s) linear infinite;animation-delay:var(--mq-delay,0s)}
.mq-row.r2{animation-direction:reverse}
.mq-half{display:flex;align-items:center;flex:0 0 auto;gap:.45em;padding-right:.45em}
@keyframes mq{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
.mq-row i{display:inline-block;flex:0 0 auto;width:.26em;height:.26em;border-radius:50%}
.mq-row.r2 span{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1.2px var(--ink)}

/* Jour */
.dnav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:32px}
.dnav-r{display:flex;flex-wrap:wrap;gap:8px}
.btn{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--ctl);background:var(--bg);color:var(--ink);font-size:14px;font-weight:500;transition:color .35s var(--ease),border-color .35s}
.btn::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--ink);border-radius:inherit;transform:translateY(102%);transition:transform .4s var(--ease)}
.btn:hover{color:var(--bg);border-color:var(--ink)}
.btn:hover::before{transform:none}
.btn-dark{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.btn-dark::before{background:#2F6FEB}
.btn-dark:hover{color:#FFFFFF;border-color:#2F6FEB}
.txt{margin:0;max-width:600px;font-size:19px;line-height:1.55;color:var(--ink2);text-wrap:pretty}
.cd{align-self:stretch;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 22px;padding-top:20px;border-top:1px solid var(--line2)}
.cd-l{display:flex;flex-direction:column;gap:10px}
.cd-big{font-family:var(--mono);font-size:54px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.cd-sub{padding-bottom:6px;font-size:15px;line-height:1.4;color:var(--ink2)}
.tl{display:flex;flex-direction:column;gap:14px}
.tl-now{position:relative;height:32px}
.tl-lanes{position:relative;height:132px}
.tl-labels{position:relative;height:66px}
.tl-hours{position:relative;height:22px;border-top:1px solid var(--line)}
.seg{position:absolute;height:38px;display:flex;align-items:center;padding:0 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--seg-ink);white-space:nowrap;overflow:hidden}
.seg-asia{background:var(--seg-asia);border:1px solid var(--seg-asia-b)}
.seg-london{background:var(--seg-lon);border:1px solid var(--seg-lon-b)}
.seg-ny{background:var(--seg-ny);border:1px solid var(--seg-ny-b)}
.zone{position:absolute;top:-8px;bottom:-8px;min-width:6px;border-radius:3px}
.zone-up{background:repeating-linear-gradient(135deg,rgba(229,72,77,.65) 0 4px,rgba(229,72,77,.2) 4px 8px)}
.zone-past{background:repeating-linear-gradient(135deg,rgba(130,130,145,.45) 0 4px,rgba(130,130,145,.14) 4px 8px)}
.nowline{position:absolute;top:-14px;bottom:-8px;width:0;border-left:1.5px dashed var(--ink)}
.nowtag{position:absolute;bottom:0;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:999px;background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mlabel{position:absolute;margin-left:-60px;width:max-content;padding:5px 11px;border-radius:999px;font-family:var(--mono);font-size:12px;white-space:nowrap}
.ml-up{background:var(--up-bg);color:var(--up-fg)}
.ml-past{background:var(--past-bg);color:var(--ink2)}
.hr{position:absolute;top:6px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--ink3)}
.dcols{display:flex;flex-wrap:wrap;align-items:flex-start;gap:48px 56px}
.dmain{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:18px}
.items{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:flex;flex-direction:column;gap:20px;padding:28px 0;border-bottom:1px solid var(--line)}
.item-top{display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px 28px}
.item-time{flex:0 0 130px;display:flex;flex-direction:column;gap:12px}
.item-time .t{font-family:var(--mono);font-size:30px;line-height:1;letter-spacing:-.04em;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.item-body{flex:999 1 280px;min-width:0;display:flex;flex-direction:column;gap:10px}
.item-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.item-h h3{margin:0;font-size:23px;line-height:1.25;font-weight:600;letter-spacing:-.025em}
.status{padding:5px 10px;border-radius:999px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.st-past{background:var(--past-bg);color:var(--ink2)}
.st-up{background:var(--up-bg);color:var(--up-fg)}
.sub{font-size:15px;line-height:1.5;color:var(--ink2)}
.note-line{font-size:14px;line-height:1.5;color:var(--ink3)}
.win{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--danger)}
.win i{display:inline-block;width:24px;height:10px;border-radius:3px;background:repeating-linear-gradient(135deg,rgba(229,72,77,.6) 0 3px,rgba(229,72,77,.18) 3px 6px)}
.plus{display:inline-flex;transition:transform .45s var(--pop)}
.explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:26px;padding:28px;border-radius:24px;background:var(--explain)}
.explain>div{display:flex;flex-direction:column;gap:8px}
.explain p{margin:0;font-size:15px;line-height:1.6;color:var(--explain-ink)}
.aside{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:44px}
.nextc{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.nextc .lines{align-self:stretch;display:flex;flex-direction:column}
.nextc .lines p{margin:0;padding:13px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5;color:var(--explain-ink)}
.wkbox{display:flex;flex-direction:column;gap:12px}
.wk{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.wk button{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:0 8px;border:none;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-size:14px;transition:background-color .25s,padding .35s var(--ease)}
.wk button:hover{background:var(--hover);padding-left:14px}
.wk button[aria-current="date"]{font-weight:700}
.wk .l{display:inline-flex;align-items:center;gap:12px}
.wk .r{font-size:13px;color:var(--ink2)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:8px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}

/* Rideau entre les pages */
#curtain{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);transform:translateY(101%);visibility:hidden;pointer-events:none}
#curtain.run{visibility:visible;animation:curtain .9s cubic-bezier(.76,0,.24,1) both}
#curtain span{font-family:var(--serif);font-style:italic;font-size:clamp(52px,9vw,150px);letter-spacing:-.02em;opacity:0;text-align:center;padding:0 24px}
#curtain.run span{animation:ctext .9s ease both}

/* Apparitions au défilement */
[data-r]{transition:transform .9s var(--ease),opacity .9s var(--ease);transition-delay:var(--d,0s)}
[data-r="up"]:not(.in){opacity:0;transform:translateY(42px)}
[data-r="left"]:not(.in){opacity:0;transform:translateX(-56px)}
[data-r="pop"]{transition-timing-function:var(--pop)}
[data-r="pop"]:not(.in){opacity:0;transform:scale(.82) translateY(20px)}
[data-r="fade"]:not(.in){opacity:0}
[data-r="draw"]{transform-origin:left center;transition-duration:1.1s}
[data-r="draw"]:not(.in){transform:scaleX(0)}
[data-r="words"] .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-bottom:-.14em}
[data-r="words"] .w>span{display:inline-block;transition:transform .95s var(--ease);transition-delay:calc(var(--d,0s) + var(--i,0) * 55ms)}
[data-r="words"]:not(.in) .w>span{transform:translateY(112%)}
.settle [data-r],.settle [data-r] .w>span{transition:none !important}
.fade{animation:fade .7s ease backwards}
.settle .fade{animation:none}
.reveal{animation:reveal .45s var(--ease) backwards}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes reveal{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}70%{box-shadow:0 0 0 8px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
@keyframes curtain{0%{transform:translateY(101%)}42%,58%{transform:translateY(0)}100%{transform:translateY(-101%)}}
@keyframes ctext{0%,28%{opacity:0;transform:translateY(40px)}44%,60%{opacity:1;transform:none}76%,100%{opacity:0;transform:translateY(-40px)}}
@media (max-width:900px){.stage{display:none}.hero,.dhero{min-height:0}}
@media (max-width:600px){.wrap{padding:0 18px}.gl{min-height:92px}.gl .num{font-size:42px}.row .c1,.row .c2{flex-basis:auto}.cd-big{font-size:42px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}#curtain{display:none}[data-r]{opacity:1 !important;transform:none !important}[data-r] .w>span{transform:none !important}}

      var win = hmOf(partsIn(ms - before * 60000, tz)) + (after === null ? ' → ' + Lx.endSpeech : ' – ' + hmOf(partsIn(ms + after * 60000, tz)));
      days[pl.cd].events.push({ e: e, ms: ms, time: pl.label, min: pl.min, dayKey: pl.p.key, win: win, before: before, after: after, past: ms <= now, major: !!e.major, short: tr(e.short), title: tr(e.title) });

  function countdown(M, d) {
    var Lx = L();
    S.cdTarget = null;
    if (d.key === M.todayKey) {
      var all = [];
      M.days.forEach(function (x) { x.events.forEach(function (e) { all.push(e); }); });
      all.sort(function (a, b) { return a.ms - b.ms; });
      var nx = all.filter(function (e) { return e.ms > M.now; })[0];
      if (!nx) { return { label: Lx.nextLater, big: '—', sub: Lx.nothingAhead }; }
      var names = all.filter(function (e) { return e.ms === nx.ms; }).map(function (e) { return e.short; }).join(' + ');
      if (nx.dayKey === d.key) {
        S.cdTarget = nx.ms;
        return { label: Lx.nextIn, big: hms((nx.ms - M.now) / 1000), sub: nx.time + ' · ' + names + ' · ' + nx.e.ccy };
      }
      return { label: Lx.nextLater, big: cap(dname(nx.dayKey, 'short')) + ' ' + hmOf(partsIn(nx.ms, S.tz)), sub: names + ' · ' + nx.e.ccy };
    }
    if (d.events.length) {
      var f = d.events[0];
      var n2 = d.events.filter(function (e) { return e.ms === f.ms; }).map(function (e) { return e.short; }).join(' + ');
      return { label: f.past ? Lx.firstDone : Lx.first, big: f.time, sub: n2 + ' · ' + f.e.ccy };
    }
    return { label: Lx.majors, big: Lx.none, sub: Lx.noneSub };

  function timeline(M, d) {
    var Lx = L();
    var tz = S.tz;
    var key = d.key;
    var t0 = zonedToUtc(key, 0, 0, tz);
    var t1 = zonedToUtc(addDays(key, 1), 0, 0, tz);
    var span = t1 - t0;
    function pc(ms) { return (Math.max(0, Math.min(1, (ms - t0) / span)) * 100).toFixed(3) + '%'; }
    var SESS = [
      { id: 'asia', tz: 'Asia/Tokyo', s: 9, e: 18 },
      { id: 'london', tz: 'Europe/London', s: 8, e: 17 },
      { id: 'ny', tz: 'America/New_York', s: 8, e: 17 }
    ];
    var nyClosed = d.notes.some(function (n) { return n.closed && n.n.ccy === 'USD'; });
    var segs = '';
    SESS.forEach(function (ss, i) {
      var parts = [];
      [-1, 0, 1].forEach(function (o) {
        var k = addDays(key, o);
        var dw = dowOf(k);
        if (dw === 0 || dw === 6) { return; }
        var a = zonedToUtc(k, ss.s, 0, ss.tz);
        var b = zonedToUtc(k, ss.e, 0, ss.tz);
        var x0 = Math.max(a, t0);
        var x1 = Math.min(b, t1);
        if (x1 > x0) { parts.push([x0, x1, a, b]); }
      });
      var wi = 0;
      parts.forEach(function (p, j) { if (p[1] - p[0] > parts[wi][1] - parts[wi][0]) { wi = j; } });
      parts.forEach(function (p, j) {
        var name = Lx.sessN[ss.id] + ' · ' + hmOf(partsIn(p[2], tz)) + '–' + hmOf(partsIn(p[3], tz));
        if (ss.id === 'ny' && nyClosed) { name = Lx.nyClosed; }
        segs += '<div class="seg seg-' + ss.id + '" data-r="draw" style="--d:' + (0.15 + i * 0.15 + j * 0.05).toFixed(2) + 's;top:' + (i * 46) + 'px;left:' + pc(p[0]) + ';width:' + ((p[1] - p[0]) / span * 100).toFixed(3) + '%">' + (j === wi ? esc(name) : '') + '</div>';
      });
    });
    var groups = {};
    var order = [];
    M.days.forEach(function (x) {
      x.events.forEach(function (e) {
        if (e.ms >= t0 && e.ms < t1) {
          if (!groups[e.ms]) { groups[e.ms] = []; order.push(e.ms); }
          groups[e.ms].push(e);
        }
      });
    });
    order.sort(function (a, b) { return a - b; });
    var zones = '';
    var labels = '';
    order.forEach(function (ms, j) {
      var g = groups[ms];
      var e = g[0];
      var zs = Math.max(t0, ms - e.before * 60000);
      var ze = Math.min(t1, ms + (e.after === null ? 60 : e.after) * 60000);
      var past = ms <= M.now;
      zones += '<div class="zone ' + (past ? 'zone-past' : 'zone-up') + '" data-r="fade" style="--d:.7s;left:' + pc(zs) + ';width:' + ((ze - zs) / span * 100).toFixed(3) + '%"></div>';
      var rel = Math.min(Math.max((ms - t0) / span, 0.07), 0.93);
      labels += '<div class="mlabel ' + (past ? 'ml-past' : 'ml-up') + '" data-r="pop" style="--d:' + (0.8 + j * 0.08).toFixed(2) + 's;top:' + (j % 2 ? 36 : 4) + 'px;left:' + (rel * 100).toFixed(3) + '%">' + hmOf(partsIn(ms, tz)) + ' · ' + esc(g.map(function (x) { return x.short; }).join(' + ')) + (past ? ' · ' + esc(Lx.done.toLowerCase()) : '') + '</div>';
    });
    var nowLine = '';
    var nowTag = '';
    if (key === M.todayKey) {
      var np = pc(M.now);
      nowLine = '<div class="nowline" style="left:' + np + '"></div>';
      nowTag = '<div class="nowtag" style="left:' + np + '"><span class="pulse" style="width:6px;height:6px"></span>' + esc(Lx.now) + ' · ' + hmOf(partsIn(M.now, tz)) + '</div>';
    }
    var hours = '';
    for (var i = 0; i <= 8; i++) {
      var st = i === 0 ? 'left:0;transform:none' : (i === 8 ? 'left:100%;transform:translateX(-100%)' : 'left:' + (i * 12.5) + '%');
      hours += '<span class="hr" style="' + st + '">' + pad(i * 3) + ':00</span>';
    }
    return '<section class="tl"><div class="sec-h" data-r="up"><span class="mono">' + esc(Lx.sec1) + '</span><span class="muted">' + esc(Lx.sess) + ' · ' + esc(tzLabel(tz)) + '</span></div>' +
      '<div class="tl-now">' + nowTag + '</div><div class="tl-lanes">' + segs + zones + nowLine + '</div><div class="tl-labels">' + labels + '</div><div class="tl-hours" data-r="fade" style="--d:.4s">' + hours + '</div>' +
      (order.length ? '' : '<p class="muted" style="margin:0">' + esc(Lx.noMarks) + '</p>') + '</section>';
  }

        } else if (!illus && j > SC.live) {

      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';

      }

      var liveClose = drawTo >= 0 ? C[drawTo].c : 100;
      for (var i = 0; i <= drawTo; i++) {

        if (isDay && c0.d === dd && focusT > 0 && !RM) { g *= 0.3 + 0.7 * easeOut((t - focusT - c0.s * 0.07) / 0.55); }

        var yo = py(c0.o); var yc = py(cl); var yh = py(hh); var yl = py(ll);

    }
    requestAnimationFrame(frame);
  })();

  load();
