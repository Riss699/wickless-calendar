<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wickless</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--ink:#111113;--ink2:#4B4B53;--ink3:#6B6B73;--line:#EAEAEE;--line2:#E4E4E9;--tint:#F6F6F8;--mono:'Fragment Mono',ui-monospace,Menlo,monospace;--serif:'Instrument Serif',Georgia,serif;--sans:'Instrument Sans','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#FFFFFF;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,select{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#scene{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}
.wrap{max-width:1320px;margin:0 auto;padding:0 32px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.muted{font-size:14px;color:var(--ink3)}
.serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.02em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 auto}

/* En-tête */
.hdr{display:flex;flex-direction:column;gap:20px;padding:24px 0 20px}
.hdr-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.brand-name{font-size:23px;font-weight:600;letter-spacing:-.035em}
.badge{padding:5px 10px;border-radius:999px;background:#F4F4F6;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.hdr-right{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.lang{display:inline-flex;padding:3px;border:1px solid #D9D9DE;border-radius:999px;background:#FFFFFF}
.lang button{min-width:46px;min-height:40px;border:none;border-radius:999px;background:transparent;color:var(--ink3);font-size:13px;font-weight:600;transition:background-color .2s,color .2s}
.lang button[aria-pressed="true"]{background:var(--ink);color:#FFFFFF}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding-left:16px;border-left:1px solid var(--line)}
.clock-time{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.ccys{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{min-width:60px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #E4E4E9;background:#FFFFFF;color:var(--ink3);font-size:13px;font-weight:600;letter-spacing:.02em;transition:border-color .2s,color .2s,background-color .2s}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.chip[aria-pressed="true"]:hover{background:#2C2C33}
.tzbox{display:flex;align-items:center;gap:10px}
.select{min-height:44px;max-width:300px;padding:0 16px;border-radius:999px;border:1px solid #D9D9DE;background:#FFFFFF;font-size:14px;cursor:pointer}

/* Structure */
.main{display:flex;flex-direction:column;gap:64px;padding-bottom:56px}
.view{display:flex;flex-direction:column;gap:72px}
.sec{display:flex;flex-direction:column;gap:18px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px}
.hint{font-size:14px;color:var(--ink2)}
.notice{margin:0;padding:18px 22px;border-radius:18px;background:var(--tint);font-size:15px;line-height:1.5;color:var(--ink2)}

/* Héros */
.hero,.dhero{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:space-between;gap:40px}
.hero{padding-top:56px;min-height:440px}
.dhero{min-height:420px}
.hero-l,.dhero-l{flex:1 1 560px;max-width:660px;min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.hero-l{gap:26px}
.dhero-l{align-items:flex-start;gap:22px}
.stage{flex:1 1 380px;min-height:340px;display:flex;align-items:flex-end;justify-content:flex-end}
.stage .cap{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.h1{margin:0;font-size:clamp(46px,5.8vw,84px);line-height:.95;font-weight:600;letter-spacing:-.045em}
.line{display:block;overflow:hidden;padding-bottom:.06em}
.line.l2{padding-bottom:.14em}
.line>.lu{display:block}
.lead{margin:0;max-width:560px;font-size:17px;line-height:1.6;color:var(--ink2);text-wrap:pretty}
.stats{display:flex;flex-wrap:wrap;gap:16px 0;max-width:560px}
.stat{flex:1 1 110px;display:flex;flex-direction:column;gap:6px;padding:0 16px;border-left:1px solid var(--line2)}
.stat b{font-family:var(--mono);font-weight:400;font-size:40px;line-height:1;letter-spacing:-.03em}
.stat span{font-size:13px;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600}
.pill .dot{width:7px;height:7px}

/* Semaine */
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}
.gl{display:flex;align-items:center;gap:16px;min-height:116px;padding:0 30px;border:none;border-radius:999px;text-align:left;transition:transform .35s cubic-bezier(.2,.7,.1,1)}
.gl:hover{transform:translateY(-5px)}
.gl .num{font-size:54px;font-weight:600;line-height:1;letter-spacing:-.05em}
.gl .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.gl .d{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.gl .lv{font-size:15px;font-weight:600;line-height:1.2}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;font-size:13px;color:var(--ink2)}
.legend .it{display:inline-flex;align-items:center;gap:8px}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px;width:100%;padding:26px 14px;border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);text-align:left;transition:background-color .25s}
.row:hover{background:rgba(247,247,249,.85)}
.row .c1{flex:0 0 190px;display:flex;align-items:center;gap:14px}
.row .num{font-size:46px;font-weight:600;line-height:1;letter-spacing:-.05em}
.row .c1m{display:flex;flex-direction:column;gap:6px}
.row .c2{flex:0 0 210px;display:flex}
.row .c3{flex:999 1 360px;min-width:0;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ev-chip{display:inline-flex;align-items:center;gap:10px;padding:9px 15px;border-radius:999px;background:#F4F4F6;border:1px solid #F4F4F6;font-size:14px;line-height:1.2}
.ev-chip.note{background:#FFFFFF;border:1px dashed #CFCFD6}
.ev-chip.past{opacity:.62}
.ev-chip .t{font-family:var(--mono);font-size:13px}
.ev-chip .g{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.ev-chip .n{font-weight:500}
.arrow{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;border:1px solid #D9D9DE;background:#FFFFFF;color:var(--ink);transition:transform .4s cubic-bezier(.2,.7,.1,1),background-color .25s,color .25s,border-color .25s}
.row:hover .arrow{transform:rotate(-45deg);background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.today-tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#B21E3B}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:#E5484D;animation:pulse 1.8s ease-out infinite}
.upc{display:flex;flex-wrap:wrap;gap:16px 40px;padding:30px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.upc>.mono{flex:0 0 200px}
.upc-body{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:10px}
.upc h2{margin:0;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.03em}
.upc p{margin:0;max-width:760px;font-size:16px;line-height:1.6;color:var(--ink2)}

/* Jour */
.dnav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:32px}
.dnav-r{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #D9D9DE;background:#FFFFFF;color:var(--ink);font-size:14px;font-weight:500;transition:border-color .2s,background-color .2s}
.btn:hover{border-color:var(--ink)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#FFFFFF;font-weight:600}
.btn-dark:hover{background:#2C2C33}
.txt{margin:0;max-width:600px;font-size:19px;line-height:1.55;color:var(--ink2);text-wrap:pretty}
.cd{align-self:stretch;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 22px;padding-top:20px;border-top:1px solid var(--line2)}
.cd-l{display:flex;flex-direction:column;gap:10px}
.cd-big{font-family:var(--mono);font-size:54px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.cd-sub{padding-bottom:6px;font-size:15px;line-height:1.4;color:var(--ink2)}
.tl{display:flex;flex-direction:column;gap:14px}
.tl-now{position:relative;height:32px}
.tl-lanes{position:relative;height:132px}
.tl-labels{position:relative;height:66px}
.tl-hours{position:relative;height:22px;border-top:1px solid var(--line)}
.seg{position:absolute;height:38px;display:flex;align-items:center;padding:0 16px;border-radius:999px;font-size:13px;font-weight:600;color:#2E2E35;white-space:nowrap;overflow:hidden}
.zone{position:absolute;top:-8px;bottom:-8px;min-width:6px;border-radius:3px}
.nowline{position:absolute;top:-14px;bottom:-8px;width:0;border-left:1.5px dashed var(--ink)}
.nowtag{position:absolute;bottom:0;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:999px;background:var(--ink);color:#FFFFFF;font-family:var(--mono);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mlabel{position:absolute;transform:translateX(-50%);padding:5px 11px;border-radius:999px;font-family:var(--mono);font-size:12px;white-space:nowrap}
.hr{position:absolute;top:6px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--ink3)}
.dcols{display:flex;flex-wrap:wrap;align-items:flex-start;gap:48px 56px}
.dmain{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:18px}
.items{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:flex;flex-direction:column;gap:20px;padding:28px 0;border-bottom:1px solid var(--line)}
.item-top{display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px 28px}
.item-time{flex:0 0 130px;display:flex;flex-direction:column;gap:12px}
.item-time .t{font-family:var(--mono);font-size:30px;line-height:1;letter-spacing:-.04em;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.item-body{flex:999 1 280px;min-width:0;display:flex;flex-direction:column;gap:10px}
.item-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.item-h h3{margin:0;font-size:23px;line-height:1.25;font-weight:600;letter-spacing:-.025em}
.status{padding:5px 10px;border-radius:999px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.st-past{background:#F1F1F4;color:var(--ink2)}
.st-up{background:#FFE1E6;color:#B21E3B}
.sub{font-size:15px;line-height:1.5;color:var(--ink2)}
.note-line{font-size:14px;line-height:1.5;color:var(--ink3)}
.win{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:#B21E3B}
.win i{display:inline-block;width:24px;height:10px;border-radius:3px;background:repeating-linear-gradient(135deg,rgba(229,72,77,.6) 0 3px,rgba(229,72,77,.18) 3px 6px)}
.plus{display:inline-flex}
.explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:26px;padding:28px;border-radius:24px;background:var(--tint)}
.explain>div{display:flex;flex-direction:column;gap:8px}
.explain p{margin:0;font-size:15px;line-height:1.6;color:#2E2E35}
.aside{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:44px}
.nextc{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.nextc .lines{align-self:stretch;display:flex;flex-direction:column}
.nextc .lines p{margin:0;padding:13px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5;color:#2E2E35}
.wkbox{display:flex;flex-direction:column;gap:12px}
.wk{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.wk button{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:0 8px;border:none;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-size:14px;transition:background-color .25s}
.wk button:hover{background:rgba(247,247,249,.85)}
.wk button[aria-current="date"]{font-weight:700}
.wk .l{display:inline-flex;align-items:center;gap:12px}
.wk .r{font-size:13px;color:var(--ink2)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:8px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}

/* Animations */
.rise{animation:rise .75s cubic-bezier(.2,.7,.1,1) backwards}
.fade{animation:fade .7s ease backwards}
.grow{transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.1,1) backwards}
.lu{animation:lineup .95s cubic-bezier(.2,.75,.1,1) backwards}
.reveal{animation:reveal .35s ease backwards}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lineup{from{transform:translateY(108%)}to{transform:none}}
@keyframes reveal{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}70%{box-shadow:0 0 0 8px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
@supports (animation-timeline: view()){.sv{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 30%}}
.settle .rise,.settle .fade,.settle .grow,.settle .lu{animation:none}
@media (max-width:900px){.stage{display:none}.hero{min-height:0}.dhero{min-height:0}}
@media (max-width:600px){.wrap{padding:0 18px}.gl{min-height:92px}.gl .num{font-size:42px}.row .c1,.row .c2{flex-basis:auto}.cd-big{font-size:42px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="app"></div>
<script>
(function () {
  'use strict';

  // ---------- Outils ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var fmtCache = {};
  function fmt(tz) {
    if (!fmtCache[tz]) {
      fmtCache[tz] = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    return fmtCache[tz];
  }
  function partsIn(ms, tz) {
    var o = {};
    fmt(tz).formatToParts(new Date(ms)).forEach(function (p) { o[p.type] = p.value; });
    return { y: +o.year, m: +o.month, d: +o.day, h: (+o.hour) % 24, mi: +o.minute, s: +o.second, key: o.year + '-' + o.month + '-' + o.day };
  }
  function tzOffsetMin(tz, ms) {
    var p = partsIn(ms, tz);
    return Math.round((Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi, p.s) - Math.floor(ms / 1000) * 1000) / 60000);
  }
  function zonedToUtc(key, h, mi, tz) {
    var a = key.split('-');
    var g = Date.UTC(+a[0], +a[1] - 1, +a[2], h, mi);
    var off = tzOffsetMin(tz, g);
    var t = g - off * 60000;
    var off2 = tzOffsetMin(tz, t);
    if (off2 !== off) { t = g - off2 * 60000; }
    return t;
  }
  function keyDate(key) { var a = key.split('-'); return new Date(Date.UTC(+a[0], +a[1] - 1, +a[2], 12)); }
  function addDays(key, n) { var d = keyDate(key); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function dowOf(key) { return keyDate(key).getUTCDay(); }
  function hmOf(p) { return pad(p.h) + ':' + pad(p.mi); }
  function hms(sec) { sec = Math.max(0, Math.floor(sec)); return pad(Math.floor(sec / 3600)) + ':' + pad(Math.floor(sec / 60) % 60) + ':' + pad(sec % 60); }
  function dur(ms) { var m = Math.max(0, Math.ceil(ms / 60000)); var h = Math.floor(m / 60); return h > 0 ? h + 'h' + pad(m % 60) : (m % 60) + ' min'; }
  function isoWeek(key) {
    var d = keyDate(key);
    var day = (d.getUTCDay() + 6) % 7;
    d.setUTCDate(d.getUTCDate() - day + 3);
    var w1 = new Date(Date.UTC(d.getUTCFullYear(), 0, 4, 12));
    return 1 + Math.round(((d - w1) / 86400000 - 3 + ((w1.getUTCDay() + 6) % 7)) / 7);
  }
  function offLabel(tz) {
    var off = tzOffsetMin(tz, Date.now());
    if (off === 0) { return 'UTC'; }
    var a = Math.abs(off);
    return 'UTC' + (off > 0 ? '+' : '−') + Math.floor(a / 60) + (a % 60 ? ':' + pad(a % 60) : '');
  }
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function dname(key, style) { return new Intl.DateTimeFormat(L().locale, { weekday: style, timeZone: 'UTC' }).format(keyDate(key)); }
  function monthName(key, style) { return new Intl.DateTimeFormat(L().locale, { month: style || 'long', timeZone: 'UTC' }).format(keyDate(key)); }
  function dayNum(key) { return +key.slice(8, 10); }

  // ---------- Textes ----------
  var I18N = {
    fr: {
      locale: 'fr-FR', colon: ' : ', at: 'à',
      beta: 'Bêta privée', ccys: 'Devises', tz: 'Fuseau',
      loading: 'Chargement du calendrier…', error: 'Impossible de charger le calendrier pour le moment.', retry: 'Réessayer',
      weekLabel: function (w, a, b) {
        var same = a.slice(5, 7) === b.slice(5, 7);
        return '(' + pad(w) + ') — Du ' + dayNum(a) + (same ? '' : ' ' + monthName(a)) + ' au ' + dayNum(b) + ' ' + monthName(b) + ' ' + b.slice(0, 4);
      },
      glance: '(01) — La semaine en un coup d’œil', hint: 'Clique sur un jour pour ouvrir son détail.',
      lv: { calme: 'Calme', calmeShort: 'Calme · séance courte', prudence: 'Prudence', piege: 'Journée piège', ferie: 'Marché US fermé' },
      lg: ['Calme', 'Prudence', 'Journée piège', 'Marché fermé'],
      only: 'Seules les annonces à fort impact (rouges) sont affichées.',
      detail: '(02) — Le détail', noEvents: 'Aucune annonce rouge sur tes devises.', today: 'Aujourd’hui', upcoming: '(03) — À venir',
      stats: function (r, h, s) { return [[r, r > 1 ? 'annonces rouges' : 'annonce rouge'], [h, h > 1 ? 'jours fériés' : 'jour férié'], [s, s > 1 ? 'séances courtes' : 'séance courte']]; },
      head: { short: ['Semaine courte,', 'et piégeuse.'], piege: ['Une semaine', 'piégeuse.'], prudence: ['Une semaine', 'à surveiller.'], calme: ['Une semaine', 'tranquille.'] },
      summary: function (red, busy, hols) {
        var hol = hols.length ? ' Férié' + (hols.length > 1 ? 's' : '') + ' : ' + hols.join(', ') + '.' : '';
        if (!red) { return 'Aucune annonce majeure sur tes devises cette semaine.' + hol; }

  function timeline(M, d) {

      var price = 100;
      for (var d = 0; d < 5; d++) {
        for (var s = 0; s < SLOTS; s++) {
          var j = d * SLOTS + s;
          var v = 0.5 + R() * 0.6;
          if (s < 2) { v *= 0.7; }
          if (SC.risk[j]) { v *= 2.2 + R() * 2; }
          if (SC.closed[d]) { v *= 0.3; }
          if (SC.shortS[j]) { v *= 0.35; }
          var o = price;
          var mv = (R() - 0.46) * 2.2 * v;
          if (Math.abs(mv) < 0.12) { mv = mv < 0 ? -0.12 : 0.12; }
          var c = o + mv;
          C.push({ d: d, s: s, i: j, o: o, c: c, h: Math.max(o, c) + (0.12 + R() * 0.55) * v, l: Math.min(o, c) - (0.12 + R() * 0.55) * v, x: j * STEP + d * GAP });
          price = c;
        }
      }
      illus = SC.live < 0;
      drawTo = illus ? 29 : Math.min(SC.live, 29);
      pmin = Infinity; pmax = -Infinity;
      for (var k = 0; k <= drawTo; k++) { pmin = Math.min(pmin, C[k].l); pmax = Math.max(pmax, C[k].h); }
      if (!isFinite(pmin)) { pmin = 99; pmax = 101; }
      var mg = (pmax - pmin) * 0.22; pmin -= mg; pmax += mg;
      dayX = []; dayY = [];
      var liveC = C[Math.max(0, drawTo)].c;
      for (var dd = 0; dd < 5; dd++) {
        var xs = 0; var lo = Infinity; var hi = -Infinity; var n = 0;
        for (var ss = 0; ss < SLOTS; ss++) {
          var cc = C[dd * SLOTS + ss];
          xs += cc.x;
          if (cc.i <= drawTo) { lo = Math.min(lo, cc.l); hi = Math.max(hi, cc.h); n++; }
        }
        dayX.push(xs / SLOTS);
        dayY.push(n ? (py(lo) + py(hi)) / 2 : py(liveC));
      }
      xEnd = C[C.length - 1].x;
    }
    function py(p) { return (p - pmin) / (pmax - pmin) * HT; }

    var cam = { tx: 22, ty: HT / 2, yaw: -0.62, pitch: 0.36, dist: 62, f: 900, sx: 900, sy: 430, alpha: 0 };
    var first = true; var start = null; var last = null; var lastFocus = null; var focusT = 0;

    function P(x, y, z) {
      var X = x - cam.tx; var Y = y - cam.ty; var Z = z;
      var cy = Math.cos(cam.yaw); var sy = Math.sin(cam.yaw);
      var x1 = X * cy - Z * sy;
      var z1 = X * sy + Z * cy;

    }
    function pushBox(list, x0, x1, y0, y1, z0, z1, rgb, a, tone) {
      var V = [P(x0, y0, z0), P(x1, y0, z0), P(x1, y1, z0), P(x0, y1, z0), P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)];
      var stroke = 'rgba(' + ((rgb[0] * 0.6) | 0) + ',' + ((rgb[1] * 0.6) | 0) + ',' + ((rgb[2] * 0.6) | 0) + ',0.45)';
      for (var q = 0; q < 6; q++) {
        var F = FACES[q];
        list.push({ v: [V[F[0]], V[F[1]], V[F[2]], V[F[3]]], depth: (V[F[0]][2] + V[F[1]][2] + V[F[2]][2] + V[F[3]][2]) / 4, fill: shade(rgb, F[4] * tone), stroke: stroke, a: a });
      }
    }
    function quad(xa, xb, za, zb, fill, stroke) {
      var a = P(xa, FLOOR, za); var b = P(xb, FLOOR, za); var c = P(xb, FLOOR, zb); var d = P(xa, FLOOR, zb);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
    }

    function frame(ts) {
      requestAnimationFrame(frame);
      if (start === null) { start = ts; last = ts; }
      var t = (ts - start) / 1000;
      var dt = Math.min(0.05, Math.max(0, (ts - last) / 1000));
      last = ts;
      var W = cv.clientWidth || window.innerWidth;
      var H = cv.clientHeight || window.innerHeight;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var bw = Math.round(W * dpr); var bh = Math.round(H * dpr);
      if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      if (!SC) { return; }
      var s2 = SC.week + '|' + SC.live + '|' + Object.keys(SC.risk).join(',') + '|' + Object.keys(SC.closed).join(',');
      if (s2 !== sig) { sig = s2; rebuild(); }

      var se = document.scrollingElement || document.documentElement;
      var scr = window.scrollY || (se ? se.scrollTop : 0) || 0;
      var maxS = se ? Math.max(1, se.scrollHeight - se.clientHeight) : 1;
      var prog = clamp01(scr / maxS);
      var isDay = SC.dayIdx !== null;
      var dd = isDay ? SC.dayIdx : 2;
      var fk = isDay ? 'd' + dd : 'w';
      if (fk !== lastFocus) { if (lastFocus !== null) { focusT = t; } lastFocus = fk; }

      var narrow = W < 900;
      var heroY = H > 760 ? 430 : H * 0.55;
      var f = Math.min(W, 1600) * 0.7;
      var lift = Math.min(scr, 320) * 0.45;
      var fade = 1 - 0.84 * smooth(0, 420, scr);
      var T;
      if (isDay) {
        T = { tx: dayX[dd], ty: dayY[dd], yaw: -0.42 + 0.7 * prog, pitch: 0.28 - 0.08 * prog, dist: 24 - 4 * prog, f: f, sx: narrow ? W * 0.5 : W * 0.72, sy: heroY + 10 - lift, alpha: (narrow ? 0.3 : 1) * fade };
      } else {
        T = { tx: xEnd / 2 - 3 + 12 * prog, ty: HT / 2, yaw: -0.62 + 1.0 * prog, pitch: 0.36 - 0.12 * prog, dist: 62 - 14 * prog, f: f, sx: narrow ? W * 0.5 : W * 0.74, sy: heroY - lift, alpha: (narrow ? 0.3 : 1) * fade };
      }
      if (!reduce) { T.yaw += 0.05 * Math.sin(t * 0.35); T.ty += 0.12 * Math.sin(t * 0.6); }
      var kk = (first || reduce) ? 1 : 1 - Math.exp(-dt * 3.2);
      ['tx', 'ty', 'yaw', 'pitch', 'dist', 'f', 'sx', 'sy'].forEach(function (k) { cam[k] += (T[k] - cam[k]) * kk; });
      cam.alpha += (T.alpha - cam.alpha) * (reduce ? 1 : 1 - Math.exp(-dt * 2.5));
      first = false;

      // Sol en pointillés
      ctx.fillStyle = '#8C8C9B';
      for (var gx = -4; gx <= xEnd + 4; gx += STEP) {
        for (var gz = -4.8; gz <= 4.81; gz += 1.2) {
          var pt = P(gx, FLOOR, gz);
          ctx.globalAlpha = cam.alpha * 0.55 * (1 - Math.abs(gz) / 5.6);
          ctx.beginPath(); ctx.arc(pt[0], pt[1], Math.max(0.6, Math.min(2.2, 42 / pt[2])), 0, 6.2832); ctx.fill();
        }
      }
      // Zones au sol
      Object.keys(SC.closed).forEach(function (di) {
        di = +di;
        ctx.globalAlpha = cam.alpha * (isDay && dd !== di ? 0.4 : 1);
        quad(C[di * SLOTS].x - 0.8, C[di * SLOTS + SLOTS - 1].x + 0.8, -2.2, 2.2, 'rgba(139,108,240,0.10)', 'rgba(139,108,240,0.45)');
      });
      for (var j = 0; j < C.length; j++) {
        var cj = C[j];
        var dimA = (isDay && cj.d !== dd) ? 0.35 : 1;
        ctx.globalAlpha = cam.alpha * dimA;
        if (SC.risk[j]) {
          var pastR = !illus && j < SC.live;
          var pulse = (pastR || reduce || j !== SC.nextRisk) ? 0 : 0.1 * (0.5 + 0.5 * Math.sin(t * 3));
          quad(cj.x - 0.62, cj.x + 0.62, -1.9, 1.9, pastR ? 'rgba(229,72,77,0.08)' : 'rgba(229,72,77,' + (0.14 + pulse).toFixed(3) + ')', pastR ? 'rgba(229,72,77,0.30)' : 'rgba(229,72,77,0.70)');
        } else if (SC.shortS[j]) {
          quad(cj.x - 0.62, cj.x + 0.62, -1.6, 1.6, 'rgba(139,108,240,0.07)', 'rgba(139,108,240,0.35)');
        } else if (!illus && j > SC.live) {
          quad(cj.x - 0.42, cj.x + 0.42, -0.42, 0.42, null, 'rgba(120,120,135,0.40)');
        }
      }
      // Jours
      ctx.font = "11px 'Fragment Mono', ui-monospace, Menlo, monospace";
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      for (var di2 = 0; di2 < 5; di2++) {
        var lp = P(dayX[di2], FLOOR, -3.4);
        var isF = isDay && di2 === dd;
        ctx.globalAlpha = cam.alpha * (isDay && !isF ? 0.45 : 1);
        ctx.fillStyle = isF ? '#111113' : '#6B6B73';
        ctx.fillText(SC.labels[di2] || '', lp[0], lp[1] + 14);
      }
      // Bougies
      var faces = [];
      var liveClose = drawTo >= 0 ? C[drawTo].c : 100;
      for (var i = 0; i <= drawTo; i++) {
        var c0 = C[i];
        var g = reduce ? 1 : easeOut((t - 0.25 - i * 0.05) / 0.6);
        if (isDay && c0.d === dd && focusT > 0 && !reduce) { g *= 0.3 + 0.7 * easeOut((t - focusT - c0.s * 0.07) / 0.55); }
        if (g <= 0.001) { continue; }
        var cl = c0.c; var hh = c0.h; var ll = c0.l;
        if (!illus && i === SC.live && !reduce) {
          cl = c0.c + 0.35 * Math.sin(t * 1.7) + 0.12 * Math.sin(t * 4.3);
          hh = Math.max(hh, cl + 0.05); ll = Math.min(ll, cl - 0.05); liveClose = cl;
        }
        var rgb = cl >= c0.o ? BULL : BEAR;
        var yo = py(c0.o); var yc = py(cl); var yh = py(hh); var yl = py(ll);
        var mid = (yo + yc) / 2;
        var b0 = mid + (Math.min(yo, yc) - mid) * g;
        var b1 = mid + (Math.max(yo, yc) - mid) * g;
        if (b1 - b0 < 0.06) { b1 = b0 + 0.06; }
        var w0 = mid + (yl - mid) * g; var w1 = mid + (yh - mid) * g;
        var a = (isDay && c0.d !== dd ? 0.22 : 1) * (illus ? 0.45 : 1);
        if (w1 > b1 + 0.01) { pushBox(faces, c0.x - WW, c0.x + WW, b1, w1, -WW, WW, rgb, a, 0.85); }
        if (w0 < b0 - 0.01) { pushBox(faces, c0.x - WW, c0.x + WW, w0, b0, -WW, WW, rgb, a, 0.85); }
        pushBox(faces, c0.x - BW, c0.x + BW, b0, b1, -BW, BW, rgb, a, 1);
      }
      faces.sort(function (m, n) { return n.depth - m.depth; });
      ctx.lineJoin = 'round';
      for (var fi = 0; fi < faces.length; fi++) {
        var Fc = faces[fi];
        ctx.globalAlpha = cam.alpha * Fc.a;
        ctx.beginPath();
        ctx.moveTo(Fc.v[0][0], Fc.v[0][1]); ctx.lineTo(Fc.v[1][0], Fc.v[1][1]); ctx.lineTo(Fc.v[2][0], Fc.v[2][1]); ctx.lineTo(Fc.v[3][0], Fc.v[3][1]);
        ctx.closePath();
        ctx.fillStyle = Fc.fill; ctx.fill();
        ctx.strokeStyle = Fc.stroke; ctx.lineWidth = 0.6; ctx.stroke();
      }
      // Maintenant
      if (!illus && SC.live >= 0 && SC.live <= 29) {
        var nx = C[SC.live].x + STEP * 0.5;
        var pTop = P(nx, HT + 0.9, 0); var pBot = P(nx, FLOOR, 0); var pNow = P(C[SC.live].x, py(liveClose), 0);
        var nowA = isDay && dd !== C[SC.live].d ? 0.35 : 1;
        ctx.globalAlpha = cam.alpha * 0.8 * nowA;
        ctx.setLineDash([3, 4]); ctx.strokeStyle = '#111113'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(pBot[0], pBot[1]); ctx.lineTo(pTop[0], pTop[1]); ctx.stroke(); ctx.setLineDash([]);
        if (!reduce) {
          var ph = (t % 1.6) / 1.6;
          ctx.globalAlpha = cam.alpha * nowA * (1 - ph) * 0.6;
          ctx.strokeStyle = '#E5484D'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(pNow[0], pNow[1], 3 + ph * 10, 0, 6.2832); ctx.stroke();
        }
        ctx.globalAlpha = cam.alpha * nowA;
        ctx.fillStyle = '#E5484D';
        ctx.beginPath(); ctx.arc(pNow[0], pNow[1], 3, 0, 6.2832); ctx.fill();
        ctx.font = "11px 'Fragment Mono', ui-monospace, Menlo, monospace";
        var tw = ctx.measureText(SC.nowTag).width + 18;
        ctx.fillStyle = '#111113';
        ctx.fillRect(pTop[0] - tw / 2, pTop[1] - 24, tw, 22);
        ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(SC.nowTag, pTop[0], pTop[1] - 13);
        ctx.textBaseline = 'alphabetic';
      }
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(frame);
  })();

  load();
})();
</script>
