name: Wickless — mise à jour et publication

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # toutes les heures (heure UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wickless-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mettre à jour le calendrier
        if: github.event_name != 'push'
        run: python3 scripts/update.py

      - name: Enregistrer data.json s'il a changé
        id: commit
        run: |
          if git diff --quiet -- data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement."
          else
            git config user.name "wickless-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Mise à jour du calendrier"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp index.html data.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
